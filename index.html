<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficación - Nicolás Vite Jesús</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --azul-tec: #002d55;
            --dorado-tec: #f9b233;
            --bg-dark: #121212;
            --sidebar-bg: #1e1e1e;
        }

        body { 
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER ESTILO PROFESIONAL --- */
        header {
            background: linear-gradient(90deg, var(--azul-tec) 0%, #004a8d 100%);
            padding: 1rem 2rem;
            border-bottom: 4px solid var(--dorado-tec);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .header-title {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* --- SIDEBAR ESTILO UIVERSE --- */
        #sidebar { 
            width: 300px; 
            background-color: var(--sidebar-bg);
            padding: 1.5rem;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-label {
            color: var(--dorado-tec);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        /* Botón estilo Uiverse "Dark Card" */
        .btn-ui {
            background: #212121;
            color: #efefef;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #323232;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .btn-ui:hover {
            background: #252525;
            border-color: var(--dorado-tec);
            transform: translateX(5px);
            color: white;
        }

        .btn-ui.active {
            background: var(--dorado-tec);
            color: #000;
            border-color: white;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(249, 178, 51, 0.4);
        }

        .btn-ui.active:hover {
            transform: none;
            color: #000;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        #main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        iframe {
            flex: 1;
            background-color: #000;
            border: none;
        }

        /* --- FOOTER --- */
        footer {
            background-color: #0c0c0c;
            padding: 0.8rem 2rem;
            font-size: 0.85rem;
            border-top: 1px solid #222;
            color: #888;
        }

        .tec-brand { color: white; font-weight: 600; }
    </style>
</head>
<body>

    <header class="d-flex justify-content-between align-items-center">
        <div class="user-info">
            <span class="badge bg-light text-dark mb-1">Alumno</span>
            <div class="h6 mb-0">Nicolás Vite Jesús</div>
        </div>
        
        <div class="header-title h3 mb-0 text-center">Manipulación de Escenarios 3D</div>
        
        <div class="text-end">
            <div class="small opacity-75">Materia</div>
            <div class="h6 mb-0">Graficación</div>
        </div>
    </header>

    <div id="main-content">
        <nav id="sidebar">
            <div class="section-label text-uppercase">Seleccionar Demo</div>
            
            <button class="btn-ui" onclick="loadWorld('assets/mundos/geometry-minecraft/geometry-minecraft.html', this)">
                📦 Geometry - Minecraft
            </button>
            
            <button class="btn-ui" onclick="loadWorld('assets/mundos/controls-map/controls-map.html', this)">
                🗺️ Controls - Map
            </button>
            
            <button class="btn-ui" onclick="loadWorld('assets/mundos/controls-orbit/controls-orbit.html', this)">
                🔄 Controls - Orbit
            </button>
            
            <button class="btn-ui active" onclick="loadWorld('assets/mundos/controls-pointerlock/controls-pointerlock.html', this)">
                🖱️ Controls - PointerLock
            </button>
            
            <button class="btn-ui" onclick="loadWorld('assets/mundos/controls-transform/controls-transform.html', this)">
                📐 Controls - Transform
            </button>
        </nav>

        <iframe id="viewer" src="assets/mundos/controls-pointerlock/controls-pointerlock.html"></iframe>
    </div>

    <footer class="d-flex justify-content-between align-items-center">
        <div>Instituto: <span class="tec-brand">TECNM Pachuca</span></div>
        <div class="fst-italic">"Excelencia en Educación Tecnológica"</div>
        <div>2026 • Ingeniería en Sistemas Computacionales</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function loadWorld(url, btn) {
            const iframe = document.getElementById('viewer');
            
            // Efecto de carga simple
            iframe.style.opacity = '0';
            
            setTimeout(() => {
                iframe.src = url;
                iframe.style.opacity = '1';
            }, 150);

            // Actualizar botones
            document.querySelectorAll('.btn-ui').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Solución para posibles errores de ruta en el iframe
        document.getElementById('viewer').onload = function() {
            this.style.opacity = '1';
        };
    </script>
</body>
</html>
